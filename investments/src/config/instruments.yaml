# Curated instrument master — the single source of truth for cross-broker identity.
#
# `id` is the stable internal identifier. `symbol` is THE display symbol used
# everywhere in the UI. `yahooSymbol` tells the market layer where to fetch
# prices + fundamentals (null = unpriced, e.g. delisted positions). `aliases`
# maps each broker to the symbol(s) it uses — always arrays.

